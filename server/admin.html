<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Linh Thú Tam Địa — Quản trị</title>
<style>
:root{
  --bg:#080d1d;--bg2:#0c1328;--panel:#101a34;--panel2:#15213f;--line:#22305a;--line2:#2d3d6e;
  --tx:#ece6d6;--mut:#8e98b6;--dim:#5f6a8c;
  --gold:#d4a94e;--gold2:#f0cd7a;--goldd:#8a6a2a;
  --son:#c8402e;--son2:#e8634c;--jade:#48c398;--sky:#6fb3e8;--plum:#b98be0;
  --r:12px;--serif:"Noto Serif","Noto Serif Display",Georgia,"DejaVu Serif","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","DejaVu Sans",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 var(--sans);background:var(--bg);color:var(--tx);-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,#16244a55,transparent 60%),radial-gradient(900px 500px at -10% 110%,#3a141055,transparent 60%),var(--bg);background-attachment:fixed}
a{color:var(--gold2);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.tab{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- đăng nhập ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.lcard{width:100%;max-width:400px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:18px;padding:28px 24px;position:relative;overflow:hidden;box-shadow:0 20px 60px #0008}
.lcard .wm{position:absolute;right:-70px;top:-70px;color:var(--gold);opacity:.07;pointer-events:none}
.lcard h1{font:700 22px/1.25 var(--serif);margin:14px 0 4px;color:var(--gold2)}
.lcard p{margin:0 0 18px;color:var(--mut)}
.logo{color:var(--gold)}

/* ---------- khung ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100%}
.side{background:linear-gradient(180deg,#0b1226,#080d1d);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:14px 10px 24px;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px;position:relative}
.brand b{display:block;font:700 15.5px/1.2 var(--serif);color:var(--gold2);letter-spacing:.2px}
.brand small{display:block;color:var(--mut);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.grp{margin:12px 8px 4px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:#c9cde0;font-size:14px;text-decoration:none;border:1px solid transparent}
.nav a svg{width:17px;height:17px;flex:none;opacity:.8}
.nav a:hover{background:#ffffff08;color:#fff}
.nav a.on{background:linear-gradient(90deg,#d4a94e22,#d4a94e08);border-color:#d4a94e44;color:var(--gold2)}
.nav a.on svg{opacity:1}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 22px;background:#080d1dd9;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top form{flex:1;max-width:460px;position:relative}
.top input{width:100%;padding:9px 12px 9px 36px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);outline:none}
.top input:focus{border-color:var(--gold)}
.top form svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mut)}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;background:#48c39814;border:1px solid #48c39840;color:#a8ecd2;font-size:13px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--jade);box-shadow:0 0 0 3px #48c39833;flex:none}
.dot.off{background:var(--dim);box-shadow:none}
.btn.burger{display:none}
.scrim{display:none;position:fixed;inset:0;background:#000a;z-index:25}
.view{padding:22px;max-width:1320px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.ph h1{font:700 23px/1.25 var(--serif);margin:0;color:#f6efdc}
.ph .sub{color:var(--mut);margin-top:3px;font-size:13px}
.crumb{font-size:12px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}

/* ---------- thành phần ---------- */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;min-width:0}
.card>h2,.card>header h2{font:700 15.5px/1.3 var(--serif);margin:0 0 12px;color:var(--gold2)}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card>header h2{margin:0}
.note{color:var(--mut);font-size:12.5px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--gold));opacity:.85}
.kpi .k{color:var(--mut);font-size:12px;letter-spacing:.04em}
.kpi .v{font:700 22px/1.25 var(--sans);margin-top:4px;font-variant-numeric:tabular-nums;color:#fff;overflow-wrap:anywhere}
.kpi .s{color:var(--mut);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:9px;border:1px solid var(--line2);background:#ffffff0a;color:var(--tx);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:#ffffff14;text-decoration:none}
.btn.pri{background:linear-gradient(180deg,#e2b85c,#b98a34);border-color:#e9c470;color:#241500}
.btn.pri:hover{filter:brightness(1.08)}
.btn.red{background:linear-gradient(180deg,#d24b37,#a3311f);border-color:#e8634c;color:#fff}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line2);background:#ffffff08;color:#cfd3e6;white-space:nowrap}
.chip.on{color:#9cecc9;border-color:#48c39855;background:#48c39814}
.chip.red{color:#ffb4a6;border-color:#e8634c66;background:#c8402e1f}
.chip.gold{color:var(--gold2);border-color:#d4a94e66;background:#d4a94e14}
.chip.sky{color:#b9dcff;border-color:#6fb3e855;background:#6fb3e814}
.chip.plum{color:#e0c8ff;border-color:#b98be055;background:#b98be014}
.chip button{background:none;border:0;color:inherit;cursor:pointer;padding:0 0 0 2px;font-size:14px;line-height:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;padding:7px 12px;cursor:pointer;color:var(--mut);font-weight:600;font-size:13px}
.seg button.on{background:#d4a94e22;color:var(--gold2)}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:0 0 4px}
.fld{margin-bottom:12px;min-width:0}
input.i,select.i,textarea.i{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);outline:none;min-width:0}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--gold)}
textarea.i{min-height:90px;resize:vertical}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:12px;letter-spacing:.03em;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#ffffff06}
.empty{padding:22px;text-align:center;color:var(--mut)}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px;color:var(--mut);font-size:13px;flex-wrap:wrap}
.who b{display:block;font-weight:650;color:#fff;overflow-wrap:anywhere}
.who small{color:var(--mut);font-size:12px}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:0;font-size:13.5px}
.kv>div{padding:8px 4px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.kv>div:nth-child(odd){color:var(--mut)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;padding:10px 16px;border-radius:10px;background:#15213f;border:1px solid var(--line2);box-shadow:0 10px 30px #000a;max-width:calc(100% - 32px);font-weight:600}
.toast.ok{border-color:#48c39888;color:#bff3df}.toast.bad{border-color:#e8634c99;color:#ffc5b9}
.err{color:#ffb4a6}
.load{color:var(--mut);padding:30px 0;text-align:center}
dialog{background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--tx);border:1px solid var(--line2);border-radius:16px;padding:20px;width:min(460px,calc(100% - 28px));box-shadow:0 30px 80px #000c}
dialog::backdrop{background:#03060fcc}
dialog h3{font:700 17px/1.3 var(--serif);margin:0 0 6px;color:var(--gold2)}
dialog p.note{margin:0 0 14px}
.bar{height:6px;border-radius:6px;background:#ffffff10;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--goldd),var(--gold2))}
.hb{display:grid;grid-template-columns:minmax(70px,140px) 1fr auto;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{height:10px}
.hb .n{text-align:right;white-space:nowrap;min-width:84px;color:var(--mut);font-variant-numeric:tabular-nums}
.chart{width:100%;position:relative;min-height:60px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--mut);font:11px var(--sans)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
pre.json{background:#060a17;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:420px;overflow:auto;font:12px/1.5 ui-monospace,"DejaVu Sans Mono",monospace;white-space:pre-wrap;word-break:break-all;color:#cfd6ee}
code,.mono{font-family:ui-monospace,"DejaVu Sans Mono",monospace;font-size:12.5px}

/* ---------- người chơi ---------- */
.phead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;position:relative;overflow:hidden}
.phead .wm{position:absolute;right:-60px;top:-80px;color:var(--gold);opacity:.05;pointer-events:none}
.ava{width:64px;height:64px;border-radius:16px;flex:none;display:grid;place-items:center;font:700 26px var(--serif);color:#241500;background:linear-gradient(135deg,var(--gold2),var(--goldd));box-shadow:inset 0 0 0 2px #ffffff30}
.pinfo{flex:1;min-width:220px}
.pname{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pname h1{font:700 24px/1.2 var(--serif);margin:0;color:#fff;overflow-wrap:anywhere}
.pmeta{color:var(--mut);font-size:13px;margin-top:6px;display:flex;gap:6px 14px;flex-wrap:wrap}
.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:16px 0}
.stat{background:#0b1329;border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-width:0}
.stat .k{color:var(--mut);font-size:12px}
.stat .v{font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{color:var(--mut);font-size:12px;overflow-wrap:anywhere}
.stat.warn .v{color:var(--son2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 14px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none}
.tabs a.on{color:var(--gold2);border-color:var(--gold)}
.days{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,26px);grid-auto-columns:26px;gap:4px;margin-top:4px}
.days i{border-radius:5px;background:#ffffff0a;font:600 9.5px/26px var(--sans);text-align:center;color:#ffffff55;font-style:normal}
.days i.l1{background:#48c39840;color:#d9fff0aa}.days i.l2{background:#48c39880;color:#effff8}.days i.l3{background:#48c398;color:#05261a}
.days i.x{background:none}
.dwrap{display:flex;gap:8px;overflow-x:auto}
.dlab{display:grid;grid-template-rows:repeat(7,26px);gap:4px;margin-top:4px;font-size:10.5px;color:var(--dim)}
.dlab span{line-height:26px}
.cards{display:flex;flex-wrap:wrap;gap:6px}
.cc{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 4px;border-radius:8px;background:#0b1329;border:1px solid var(--line);font-size:12.5px;max-width:100%}
.cc b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:6px;background:#6fb3e833;color:#cfe7ff;font-size:11.5px}
.cc em{font-style:normal;color:var(--gold2);font-weight:700;font-size:11.5px}
.deck{padding:10px 0;border-bottom:1px solid var(--line)}
.deck:last-child{border:0}
.deck h4{margin:0 0 8px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.ret td{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.ret td:first-child,.ret th:first-child{text-align:left}
.ret td.c{font-weight:600}
.mailprev{background:linear-gradient(180deg,#1b2850,#121c3a);border:1px solid #d4a94e55;border-radius:14px;padding:16px;position:relative;overflow:hidden}
.mailprev .wm{position:absolute;right:-40px;bottom:-40px;color:var(--gold);opacity:.08}
.mailprev h3{font:700 16px var(--serif);margin:0 0 8px;color:var(--gold2);overflow-wrap:anywhere}
.mailprev p{white-space:pre-wrap;margin:0 0 12px;color:#dcd8cc;overflow-wrap:anywhere}

@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-102%);transition:transform .2s ease;box-shadow:20px 0 60px #000a}
  body.menu .side{transform:none}
  body.menu .scrim{display:block}
  .btn.burger{display:inline-flex;padding:8px}
  .top{padding:10px 12px;gap:8px}
  .top .sp{display:none}
  .top form{max-width:none}
  .view{padding:16px 12px}
  .g2,.g3{grid-template-columns:1fr}
}
@media (max-width:560px){
  .pill .t{display:none}
  .top .lo .t{display:none}
  .ph h1{font-size:20px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .v{font-size:19px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat .v{font-size:16px}
  .kv{grid-template-columns:118px 1fr}
  .card{padding:13px}
  table.stack thead{display:none}
  table.stack tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 2px;border-bottom:1px solid var(--line)}
  table.stack td{border:0;padding:1px 0}
  table.stack td.hide-m{display:none}
  table.stack td.n{text-align:right}
  .pname h1{font-size:21px}
  .ava{width:52px;height:52px;font-size:21px}
}
</style>
</head>
<body>
<div id="login" hidden>
  <form class="lcard" id="lform" autocomplete="off">
    <div class="wm" data-drum="260"></div>
    <div class="logo" data-drum="54"></div>
    <h1>Linh Thú Tam Địa — Quản trị</h1>
    <p>Nhập mã quản trị (ADMIN_TOKEN) để vào bảng điều khiển.</p>
    <div class="fld"><label class="f" for="ltok">Mã quản trị</label><input class="i" id="ltok" type="password" required autocomplete="off"></div>
    <details class="fld"><summary class="note" style="cursor:pointer">Máy chủ khác</summary>
      <div style="margin-top:8px"><label class="f" for="lsrv">Địa chỉ máy chủ (để trống nếu mở trang này từ chính máy chủ)</label><input class="i" id="lsrv" placeholder="https://linhthu-server.xxx.workers.dev"></div>
    </details>
    <button class="btn pri" style="width:100%;padding:11px" type="submit">Vào quản trị</button>
    <div class="err" id="lerr" style="margin-top:10px;min-height:20px"></div>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><span class="logo" data-drum="40"></span><span><b>Linh Thú Tam Địa</b><small>Quản trị</small></span></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="btn burger" id="burger" aria-label="Mở menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <form id="qform" role="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Mã hoặc tên người chơi" aria-label="Mã hoặc tên người chơi" autocomplete="off"></form>
      <span class="sp"></span>
      <a class="pill" href="#/realtime" id="onl"><span class="dot"></span><span class="num" id="onln">–</span><span class="t">online</span></a>
      <button class="btn lo" id="logout" title="Đăng xuất"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg><span class="t">Đăng xuất</span></button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<dialog id="dlg"></dialog>

<script>
(function(){
"use strict";
/* ================= tiện ích ================= */
const $=id=>document.getElementById(id);
// Tạo phần tử: chuỗi con luôn thành text node (chống XSS). Thuộc tính 'html' CHỈ dùng cho nội dung hằng trong mã.
function h(tag,props,...kids){const e=document.createElement(tag);setp(e,props);add(e,kids);return e;}
function setp(e,p){if(!p)return;for(const k in p){const v=p[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="value")e.value=v;else e.setAttribute(k,v===true?"":v);}}
function add(e,kids){for(const k of kids.flat(9)){if(k==null||k===false)continue;e.append(k instanceof Node?k:document.createTextNode(String(k)));}return e;}
const SVGNS="http://www.w3.org/2000/svg";
function s(tag,attrs,...kids){const e=document.createElementNS(SVGNS,tag);for(const k in attrs||{})if(attrs[k]!=null)e.setAttribute(k,attrs[k]);for(const k of kids.flat(9)){if(k==null)continue;e.append(k instanceof Node?k:document.createTextNode(String(k)));}return e;}
const NF=new Intl.NumberFormat("vi-VN");
const num=n=>n==null||!isFinite(n)?"–":NF.format(Math.round(n));
const pct=(a,b)=>b?(Math.round(1000*a/b)/10).toString().replace(".",",")+"%":"–";
const p2=n=>String(n).padStart(2,"0");
const VN=7*3600e3;
function vd(ts){const d=new Date(ts+VN);return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),H:d.getUTCHours(),M:d.getUTCMinutes(),w:d.getUTCDay()};}
const fDate=ts=>{if(!ts)return "–";const x=vd(ts);return p2(x.d)+"/"+p2(x.m)+"/"+x.y;};
const fTime=ts=>{if(!ts)return "–";const x=vd(ts);return p2(x.d)+"/"+p2(x.m)+"/"+x.y+" "+p2(x.H)+":"+p2(x.M);};
const fDay=day=>{const [y,m,d]=day.split("-");return d+"/"+m;};
const todayVN=()=>new Date(Date.now()+VN).toISOString().slice(0,10);
const dayAdd=(day,n)=>new Date(Date.parse(day+"T00:00:00Z")+n*864e5).toISOString().slice(0,10);
function fDur(ms){if(!ms)return "0 phút";const m=Math.round(ms/6e4),hh=Math.floor(m/60),mm=m%60;return hh?(hh+" giờ"+(mm?" "+mm+" phút":"")):mm+" phút";}
function ago(ts){if(!ts)return "chưa thấy";const d=Date.now()-ts;if(d<6e4)return "vừa xong";if(d<36e5)return Math.floor(d/6e4)+" phút trước";if(d<864e5)return Math.floor(d/36e5)+" giờ trước";if(d<30*864e5)return Math.floor(d/864e5)+" ngày trước";return fDate(ts);}

/* trống đồng: hoạ tiết hằng (không chứa dữ liệu người dùng) */
function drum(sz){
  let p='<svg viewBox="0 0 100 100" width="'+sz+'" height="'+sz+'" aria-hidden="true" fill="none" stroke="currentColor">';
  p+='<circle cx="50" cy="50" r="48" stroke-width="2"/><circle cx="50" cy="50" r="43" stroke-width=".8"/><circle cx="50" cy="50" r="33" stroke-width=".8"/><circle cx="50" cy="50" r="22" stroke-width=".8"/><circle cx="50" cy="50" r="15" stroke-width=".6"/>';
  let star="";for(let i=0;i<14;i++){const a=i*Math.PI*2/14,b=a+Math.PI/14,c=a-Math.PI/14;star+=(i?"L":"M")+(50+4*Math.cos(c)).toFixed(2)+" "+(50+4*Math.sin(c)).toFixed(2)+"L"+(50+13.5*Math.cos(a)).toFixed(2)+" "+(50+13.5*Math.sin(a)).toFixed(2)+"L"+(50+4*Math.cos(b)).toFixed(2)+" "+(50+4*Math.sin(b)).toFixed(2);}
  p+='<path d="'+star+'Z" fill="currentColor" stroke="none"/>';
  let t="";for(let i=0;i<48;i++){const a=i*Math.PI/24;t+="M"+(50+43*Math.cos(a)).toFixed(2)+" "+(50+43*Math.sin(a)).toFixed(2)+"L"+(50+47.5*Math.cos(a)).toFixed(2)+" "+(50+47.5*Math.sin(a)).toFixed(2);}
  p+='<path d="'+t+'" stroke-width=".7"/>';
  let b2="";for(let i=0;i<8;i++){const a=i*Math.PI/4+.2,r=27.5,x=50+r*Math.cos(a),y=50+r*Math.sin(a),dx=Math.cos(a+1.57)*4,dy=Math.sin(a+1.57)*4,ox=Math.cos(a)*2.2,oy=Math.sin(a)*2.2;b2+="M"+(x-dx).toFixed(2)+" "+(y-dy).toFixed(2)+"Q"+(x+ox).toFixed(2)+" "+(y+oy).toFixed(2)+" "+(x+dx).toFixed(2)+" "+(y+dy).toFixed(2);}
  p+='<path d="'+b2+'" stroke-width="1.6" stroke-linecap="round"/>';
  let c2="";for(let i=0;i<24;i++){const a=i*Math.PI/12;c2+='<circle cx="'+(50+38*Math.cos(a)).toFixed(2)+'" cy="'+(50+38*Math.sin(a)).toFixed(2)+'" r="1.4" fill="currentColor" stroke="none"/>';}
  return p+c2+"</svg>";
}

let TOK=sessionStorage.getItem("ltd.admin.tok")||"";
let SRV=localStorage.getItem("ltd.admin.srv")||"";
const base=()=>SRV.trim().replace(/\/+$/,"");
async function api(method,path,body){
  let r;
  try{r=await fetch(base()+path,{method,headers:{"content-type":"application/json","x-admin-token":TOK},body:body===undefined?undefined:JSON.stringify(body)});}
  catch(e){throw new Error("Không kết nối được máy chủ");}
  let j={};try{j=await r.json();}catch(e){}
  if(r.status===401&&path.startsWith("/api/admin/")){logout("Mã quản trị không đúng hoặc đã đổi.");throw new Error("Sai mã quản trị");}
  if(!r.ok)throw new Error(j.message||j.error||("Lỗi "+r.status));
  return j;
}

function niceMax(v){if(v<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
const short=n=>n>=1e6?(Math.round(n/1e5)/10+"tr").replace(".",","):n>=1e3?(Math.round(n/100)/10+"k").replace(".",","):String(Math.round(n*10)/10).replace(".",",");
// series: [{name,color,vals:[...]}] cùng độ dài với labels (ngày); kind 'bar' (chồng) | 'line'
function series(labels,ser,{kind="bar",fmt=num}={}){
  return (W,H)=>{
    const L=38,R=8,T=10,B=24,iw=W-L-R,ih=H-T-B,n=labels.length;
    const tot=labels.map((_,i)=>kind==="bar"?ser.reduce((a,x)=>a+(x.vals[i]||0),0):Math.max(...ser.map(x=>x.vals[i]||0)));
    const mx=niceMax(Math.max(1,...tot));
    const svg=s("svg",{width:W,height:H,viewBox:"0 0 "+W+" "+H,role:"img"});
    for(let g=0;g<=4;g++){const y=T+ih-ih*g/4;svg.append(s("line",{x1:L,x2:W-R,y1:y,y2:y,stroke:g?"#ffffff10":"#ffffff26"}),s("text",{x:L-6,y:y+4,"text-anchor":"end"},short(mx*g/4)));}
    const step=iw/Math.max(1,n),every=Math.ceil(n/Math.max(2,Math.floor(iw/46)));
    labels.forEach((lb,i)=>{if(i%every===0||i===n-1&&n<=8)svg.append(s("text",{x:L+step*i+step/2,y:H-6,"text-anchor":"middle"},fDay(lb)));});
    if(kind==="bar"){
      const bw=Math.max(2,Math.min(26,step*.68));
      labels.forEach((lb,i)=>{let acc=0;const g=s("g",{});for(const x of ser){const v=x.vals[i]||0;if(!v)continue;const hh=ih*v/mx,y=T+ih-ih*acc/mx-hh;g.append(s("rect",{x:L+step*i+(step-bw)/2,y:y,width:bw,height:Math.max(1,hh),rx:Math.min(3,bw/3),fill:x.color}));acc+=v;}
        g.append(s("rect",{x:L+step*i,y:T,width:step,height:ih,fill:"transparent"},s("title",{},fDay(lb)+": "+ser.map(x=>(ser.length>1?x.name+" ":"")+fmt(x.vals[i]||0)).join(" · "))));svg.append(g);});
    }else{
      for(const x of ser){const pts=x.vals.map((v,i)=>[L+step*i+step/2,T+ih-ih*(v||0)/mx]);
        const id="gr"+Math.random().toString(36).slice(2,8);
        svg.append(s("defs",{},s("linearGradient",{id,x1:0,x2:0,y1:0,y2:1},s("stop",{offset:"0","stop-color":x.color,"stop-opacity":".35"}),s("stop",{offset:"1","stop-color":x.color,"stop-opacity":"0"}))));
        if(pts.length>1)svg.append(s("path",{d:"M"+pts[0][0]+" "+(T+ih)+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("")+"L"+pts[pts.length-1][0]+" "+(T+ih)+"Z",fill:"url(#"+id+")"}));
        svg.append(s("polyline",{points:pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" "),fill:"none",stroke:x.color,"stroke-width":2,"stroke-linejoin":"round"}));
        pts.forEach((p,i)=>svg.append(s("circle",{cx:p[0],cy:p[1],r:n>40?1.6:2.6,fill:x.color},s("title",{},fDay(labels[i])+": "+fmt(x.vals[i]||0)))));}
    }
    return svg;
  };
}

function hbars(rows,label){const mx=Math.max(1,...rows.map(r=>r.n)),tot=rows.reduce((a,r)=>a+r.n,0);
  if(!rows.length)return h("div",{class:"empty"},"Chưa có dữ liệu");

let rid=0;
function route(){
  if($("app").hidden)return;
  document.body.classList.remove("menu");
  const raw=location.hash.replace(/^#\/?/,"")||"tong-quan";
  const [pathPart,qs]=raw.split("?");const parts=pathPart.split("/");
  const params=new URLSearchParams(qs||"");
  const key=parts[0];
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.k===key||(key==="p"&&a.dataset.k==="tra-cuu")));
  const v=$("view");v.textContent="";v.append(loading());
  const my=++rid;
  const fn=PAGES[key]||PAGES["tong-quan"];
  const out=h("div");
  Promise.resolve(fn(out,parts.slice(1),params,()=>my===rid)).then(()=>{if(my!==rid)return;v.textContent="";v.append(out);paintDrums(out);drawAll();window.scrollTo(0,0);})
    .catch(e=>{if(my!==rid)return;v.textContent="";v.append(errBox(e));});
}

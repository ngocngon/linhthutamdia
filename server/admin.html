<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>Linh Thú Tam Địa — Quản trị</title>
<style>
:root{
  --bg:#0a0e16;--bg2:#0e1420;--panel:#121a29;--panel2:#172136;--line:#222d42;--line2:#2e3b55;
  --tx:#e7ebf3;--mut:#93a0b8;--dim:#66738d;
  --acc:#7c9bff;--acc2:#a9bcff;--accd:#7c9bff1f;--accl:#7c9bff55;--onacc:#0a1233;
  --ok:#3ecf8e;--warn:#f2b84b;--bad:#f26d6d;
  --p1:#7c9bff;--p2:#4fd1c5;--p3:#f2b84b;--p4:#c084fc;--p5:#f26d6d;
  --r:12px;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","DejaVu Sans",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 var(--sans);background:var(--bg);color:var(--tx);-webkit-text-size-adjust:100%}
a{color:var(--acc2);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.num,td.n{font-variant-numeric:tabular-nums}
.mono,code{font-family:var(--mono);font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* đăng nhập */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(900px 500px at 50% -10%,#7c9bff1c,transparent 60%),var(--bg)}
.lcard{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:28px 24px;box-shadow:0 24px 70px #0009}
.lcard h1{font:700 21px/1.3 var(--sans);margin:14px 0 4px}
.lcard p{margin:0 0 18px;color:var(--mut)}
.logo{color:var(--acc);display:inline-flex}

/* khung */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:14px 10px 18px;z-index:30;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{display:block;color:var(--mut);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.nav{flex:1}
.grp{margin:16px 10px 5px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:#c3cce0;font-size:14px;text-decoration:none;border:1px solid transparent;position:relative}
.nav a svg{width:17px;height:17px;flex:none;opacity:.75}
.nav a:hover{background:#ffffff08;color:#fff}
.nav a.on{background:var(--accd);color:var(--acc2);font-weight:600}
.nav a.on:before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.nav a.on svg{opacity:1}
.sfoot{padding:12px 10px 0;border-top:1px solid var(--line);color:var(--dim);font-size:12px;margin-top:12px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 24px;background:#0a0e16e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.sbox{position:relative;flex:1;max-width:460px;min-width:0}
.sbox input{width:100%;padding:9px 40px 9px 36px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);outline:none}
.sbox input:focus{border-color:var(--acc)}
.sbox>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mut)}
.sbox kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:0 5px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 18px 50px #000b;overflow:hidden;z-index:40}
.sug a,.sug div.e{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;color:var(--tx);text-decoration:none;border-bottom:1px solid var(--line)}
.sug a:last-child,.sug div.e:last-child{border:0}
.sug a:hover,.sug a.hl{background:var(--accd)}
.sug small{color:var(--mut)}
.sp{flex:1}
.stat-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--line2);color:var(--tx);font-size:13px;white-space:nowrap;text-decoration:none}
.stat-pill:hover{text-decoration:none;border-color:var(--accl)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #3ecf8e2e;flex:none;display:inline-block}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px #f2b84b2e}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px #f26d6d2e}
.dot.off{background:var(--dim);box-shadow:none}
.btn.burger{display:none}
.scrim{display:none;position:fixed;inset:0;background:#000b;z-index:25}
.view{padding:22px 24px 40px;max-width:1360px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.ph h1{font:700 22px/1.25 var(--sans);margin:0;letter-spacing:-.01em}
.ph .sub{color:var(--mut);margin-top:3px;font-size:13px}
.crumb{font-size:12px;color:var(--dim);margin-bottom:4px}
.crumb a{color:var(--mut)}

/* thành phần */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;min-width:0}
.card>h2,.card>header h2{font:650 14.5px/1.3 var(--sans);margin:0 0 12px;color:var(--tx)}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card>header h2{margin:0}
.note{color:var(--mut);font-size:12.5px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2>.card,.g3>.card{margin-bottom:0}
.grid+.card,.grid+.grid,.kpis+.grid,.kpis+.card{margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.kpi .k{color:var(--mut);font-size:12.5px}
.kpi .v{font:700 24px/1.25 var(--sans);margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{color:var(--mut);font-size:12px;overflow-wrap:anywhere}
.kpi .dl{font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .dl span{color:var(--mut);font-weight:400}
.up{color:var(--ok)}.dn{color:var(--bad)}.fl{color:var(--mut)}
.kpi .spk{display:block;width:100%;height:28px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:#1e2a42;text-decoration:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.pri:hover{background:var(--acc2)}
.btn.red{background:#3a1a22;border-color:#7a2f3b;color:#ffb3b3}
.btn.red:hover{background:#4a2029}
.btn.red.solid{background:var(--bad);border-color:var(--bad);color:#2a0709}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line2);background:#ffffff08;color:#cdd5e6;white-space:nowrap}
.chip.on{color:#8be9c0;border-color:#3ecf8e55;background:#3ecf8e14}
.chip.red{color:#ffb3b3;border-color:#f26d6d66;background:#f26d6d1a}
.chip.gold{color:#f7d58b;border-color:#f2b84b66;background:#f2b84b14}
.chip.sky,.chip.acc{color:var(--acc2);border-color:var(--accl);background:var(--accd)}
.chip.plum{color:#ddc2ff;border-color:#c084fc55;background:#c084fc14}
.chip button{background:none;border:0;color:inherit;cursor:pointer;padding:0 0 0 2px;font-size:14px;line-height:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;flex-wrap:wrap;background:var(--bg2)}
.seg button{background:none;border:0;padding:7px 12px;cursor:pointer;color:var(--mut);font-weight:600;font-size:13px}
.seg button.on{background:var(--accd);color:var(--acc2)}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:0 0 4px}
.fld{margin-bottom:12px;min-width:0}
input.i,select.i,textarea.i{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);outline:none;min-width:0}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--acc)}
textarea.i{min-height:90px;resize:vertical}
input[type=checkbox]{accent-color:var(--acc)}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tbar .grow{flex:1;min-width:160px}
.tbar input.i{max-width:340px}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap;background:transparent;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--tx)}
th .ar{display:inline-block;width:10px;margin-left:3px;color:var(--acc);font-size:10px}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#ffffff06}
.empty{padding:34px 16px;text-align:center;color:var(--mut)}
.empty .ei{width:44px;height:44px;border-radius:12px;background:var(--accd);color:var(--acc);display:grid;place-items:center;margin:0 auto 10px}
.empty .ei svg{width:22px;height:22px}
.empty b{display:block;color:var(--tx);margin-bottom:3px}
.errbox{border-color:#7a2f3b;background:#1c1318;text-align:center;padding:30px 16px}
.errbox .ei{background:#f26d6d1f;color:var(--bad)}
.errbox .m{color:#ffb3b3;margin:4px 0 12px;overflow-wrap:anywhere}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:12px;color:var(--mut);font-size:13px;flex-wrap:wrap}
.pager .sp2{flex:1}
.pager select{padding:4px 6px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2)}
.who b{display:block;font-weight:600;color:#fff;overflow-wrap:anywhere}
.who small{color:var(--mut);font-size:12px}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;font-size:13.5px}
.kv>div{padding:8px 4px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.kv>div:nth-child(odd){color:var(--mut)}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:calc(100% - 32px);pointer-events:none}
.toast{padding:10px 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);box-shadow:0 12px 34px #000a;font-weight:600}
.toast.ok{border-color:#3ecf8e88;color:#bff3df}.toast.bad{border-color:#f26d6d99;color:#ffc5c5}
.err{color:#ffb3b3}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line2);border-radius:16px;padding:20px;width:min(480px,calc(100% - 28px));box-shadow:0 30px 80px #000c;max-height:calc(100vh - 40px);overflow:auto}
dialog::backdrop{background:#04070dcc}
dialog h3{font:700 17px/1.3 var(--sans);margin:0 0 6px}
dialog p.note{margin:0 0 14px}
dialog .sum{border:1px solid var(--line);border-radius:10px;padding:2px 10px;margin:0 0 12px;background:var(--bg2)}
dialog .warnbox{border:1px solid #7a2f3b;background:#2a151b;color:#ffc5c5;border-radius:10px;padding:9px 11px;margin:0 0 12px;font-size:13px}
.bar{height:6px;border-radius:6px;background:#ffffff12;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.hb{display:grid;grid-template-columns:minmax(70px,140px) 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{height:10px}
.hb .n{text-align:right;white-space:nowrap;min-width:84px;color:var(--mut);font-variant-numeric:tabular-nums}
.chart{width:100%;position:relative;min-height:60px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--dim);font:11px var(--sans)}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 10px 26px #000a;white-space:nowrap;transform:translate(-50%,-100%)}
.tip b{display:block;margin-bottom:2px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
pre.json{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:420px;overflow:auto;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;color:#cfd6ee}
.sk{background:linear-gradient(90deg,#ffffff08,#ffffff12,#ffffff08);background-size:200% 100%;animation:sk 1.3s linear infinite;border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}
.skk{height:96px}.skc{height:240px;margin-bottom:16px}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

/* người chơi */
.phead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.ava{width:60px;height:60px;border-radius:14px;flex:none;display:grid;place-items:center;font:700 24px var(--sans);color:var(--onacc);background:var(--acc)}
.pinfo{flex:1;min-width:220px}
.pname{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pname h1{font:700 23px/1.2 var(--sans);margin:0;overflow-wrap:anywhere}
.pmeta{color:var(--mut);font-size:13px;margin-top:6px;display:flex;gap:6px 14px;flex-wrap:wrap}
.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:16px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat .k{color:var(--mut);font-size:12px}
.stat .v{font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{color:var(--mut);font-size:12px;overflow-wrap:anywhere}
.stat.warn .v{color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 14px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none}
.tabs a.on{color:var(--acc2);border-color:var(--acc)}
.days{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,26px);grid-auto-columns:26px;gap:4px;margin-top:4px}
.days i{border-radius:5px;background:#ffffff0a;font:600 9.5px/26px var(--sans);text-align:center;color:#ffffff55;font-style:normal}
.days i.l1{background:#7c9bff40;color:#e8eeffaa}.days i.l2{background:#7c9bff80;color:#fff}.days i.l3{background:var(--acc);color:var(--onacc)}
.days i.x{background:none}
.dwrap{display:flex;gap:8px;overflow-x:auto}
.dlab{display:grid;grid-template-rows:repeat(7,26px);gap:4px;margin-top:4px;font-size:10.5px;color:var(--dim)}
.dlab span{line-height:26px}
.cards{display:flex;flex-wrap:wrap;gap:6px}
.cc{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 4px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px;max-width:100%}
.cc b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:6px;background:var(--accd);color:var(--acc2);font-size:11.5px}
.cc em{font-style:normal;color:var(--warn);font-weight:700;font-size:11.5px}
.deck{padding:10px 0;border-bottom:1px solid var(--line)}
.deck:last-child{border:0}
.deck h4{margin:0 0 8px;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ret td{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.ret td:first-child,.ret th:first-child{text-align:left}
.ret th{text-align:center}
.ret td.c{font-weight:600}
.mailprev{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:16px}
.mailprev h3{font:700 16px var(--sans);margin:0 0 8px;overflow-wrap:anywhere}
.mailprev p{white-space:pre-wrap;margin:0 0 12px;color:#d3d9e8;overflow-wrap:anywhere}
.stepper{display:flex;gap:6px;align-items:center}

@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-102%);transition:transform .2s ease;box-shadow:20px 0 60px #000a}
  body.menu .side{transform:none}
  body.menu .scrim{display:block}
  .btn.burger{display:inline-flex;padding:8px}
  .top{padding:10px 12px;gap:8px}
  .sp{display:none}
  .sbox{max-width:none}
  .sbox kbd{display:none}
  .view{padding:16px 12px 32px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .ver{display:none}
}
@media (max-width:640px){
  .stat-pill .t,.top .lo .t{display:none}
  .stat-pill{padding:7px 9px}
  .ph h1{font-size:20px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:11px 12px}
  .kpi .v{font-size:20px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat .v{font-size:15px}
  .kv{grid-template-columns:116px 1fr}
  .card{padding:13px}
  table.stack thead{display:none}
  table.stack tr{display:block;padding:10px 2px;border-bottom:1px solid var(--line)}
  table.stack tbody tr:last-child{border-bottom:0}
  table.stack td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:3px 0;min-width:0;text-align:right}
  table.stack td::before{content:attr(data-l);color:var(--mut);font-size:12px;flex:none;text-align:left}
  table.stack td.t1{text-align:left;justify-content:flex-start;padding-bottom:5px}
  table.stack td.t1::before,table.stack td[data-l=""]::before{display:none}
  table.stack td[data-l=""]{justify-content:flex-start;padding-top:6px}
  table.stack td.hide-m{display:none}
  table.stack td.empty{display:block;text-align:center}
  table.stack td.empty::before{display:none}
  .pname h1{font-size:20px}
  .ava{width:50px;height:50px;font-size:20px}
  .pager .sp2{display:none}
  .tbar input.i{max-width:none}
}
</style>
</head>
<body>
<div id="login" hidden>
  <form class="lcard" id="lform" autocomplete="off">
    <div class="logo" data-drum="48"></div>
    <h1>Linh Thú Tam Địa — Quản trị</h1>
    <p>Nhập mã quản trị (ADMIN_TOKEN) để vào bảng điều hành.</p>

(function(){
"use strict";
/* ================= tiện ích ================= */
const $=id=>document.getElementById(id);
// Tạo phần tử: chuỗi con luôn thành text node (chống XSS). Thuộc tính 'html' CHỈ dùng cho nội dung hằng trong mã.
function h(tag,props,...kids){const e=document.createElement(tag);setp(e,props);add(e,kids);return e;}
function setp(e,p){if(!p)return;for(const k in p){const v=p[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="value")e.value=v;else e.setAttribute(k,v===true?"":v);}}
function add(e,kids){for(const k of kids.flat(9)){if(k==null||k===false)continue;e.append(k instanceof Node?k:document.createTextNode(String(k)));}return e;}
const SVGNS="http://www.w3.org/2000/svg";
function s(tag,attrs,...kids){const e=document.createElementNS(SVGNS,tag);for(const k in attrs||{})if(attrs[k]!=null)e.setAttribute(k,attrs[k]);for(const k of kids.flat(9)){if(k==null)continue;e.append(k instanceof Node?k:document.createTextNode(String(k)));}return e;}
const NF=new Intl.NumberFormat("vi-VN");
const num=n=>n==null||!isFinite(n)?"–":NF.format(Math.round(n));
const pct=(a,b)=>b?(Math.round(1000*a/b)/10).toString().replace(".",",")+"%":"–";
const p2=n=>String(n).padStart(2,"0");
const VN=7*3600e3;
function vd(ts){const d=new Date(ts+VN);return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),H:d.getUTCHours(),M:d.getUTCMinutes(),w:d.getUTCDay()};}
const fDate=ts=>{if(!ts)return "–";const x=vd(ts);return p2(x.d)+"/"+p2(x.m)+"/"+x.y;};
const fTime=ts=>{if(!ts)return "–";const x=vd(ts);return p2(x.d)+"/"+p2(x.m)+"/"+x.y+" "+p2(x.H)+":"+p2(x.M);};
const fDay=day=>{const [y,m,d]=day.split("-");return d+"/"+m;};
const todayVN=()=>new Date(Date.now()+VN).toISOString().slice(0,10);
const dayAdd=(day,n)=>new Date(Date.parse(day+"T00:00:00Z")+n*864e5).toISOString().slice(0,10);
function fDur(ms){if(!ms)return "0 phút";const m=Math.round(ms/6e4),hh=Math.floor(m/60),mm=m%60;return hh?(hh+" giờ"+(mm?" "+mm+" phút":"")):mm+" phút";}
function ago(ts){if(!ts)return "chưa thấy";const d=Date.now()-ts;if(d<6e4)return "vừa xong";if(d<36e5)return Math.floor(d/6e4)+" phút trước";if(d<864e5)return Math.floor(d/36e5)+" giờ trước";if(d<30*864e5)return Math.floor(d/864e5)+" ngày trước";return fDate(ts);}
// "YYYY-MM-DDTHH:mm" (giờ VN) <-> mốc ms
const fromLocal=v=>v?Date.parse(v+":00Z")-VN:null;

/* trống đồng: hoạ tiết hằng (không chứa dữ liệu người dùng) */
function drum(sz){
  let p='<svg viewBox="0 0 100 100" width="'+sz+'" height="'+sz+'" aria-hidden="true" fill="none" stroke="currentColor">';
  p+='<circle cx="50" cy="50" r="48" stroke-width="2"/><circle cx="50" cy="50" r="43" stroke-width=".8"/><circle cx="50" cy="50" r="33" stroke-width=".8"/><circle cx="50" cy="50" r="22" stroke-width=".8"/><circle cx="50" cy="50" r="15" stroke-width=".6"/>';
  let star="";for(let i=0;i<14;i++){const a=i*Math.PI*2/14,b=a+Math.PI/14,c=a-Math.PI/14;star+=(i?"L":"M")+(50+4*Math.cos(c)).toFixed(2)+" "+(50+4*Math.sin(c)).toFixed(2)+"L"+(50+13.5*Math.cos(a)).toFixed(2)+" "+(50+13.5*Math.sin(a)).toFixed(2)+"L"+(50+4*Math.cos(b)).toFixed(2)+" "+(50+4*Math.sin(b)).toFixed(2);}
  p+='<path d="'+star+'Z" fill="currentColor" stroke="none"/>';
  let t="";for(let i=0;i<48;i++){const a=i*Math.PI/24;t+="M"+(50+43*Math.cos(a)).toFixed(2)+" "+(50+43*Math.sin(a)).toFixed(2)+"L"+(50+47.5*Math.cos(a)).toFixed(2)+" "+(50+47.5*Math.sin(a)).toFixed(2);}
  p+='<path d="'+t+'" stroke-width=".7"/>';
  let b2="";for(let i=0;i<8;i++){const a=i*Math.PI/4+.2,r=27.5,x=50+r*Math.cos(a),y=50+r*Math.sin(a),dx=Math.cos(a+1.57)*4,dy=Math.sin(a+1.57)*4,ox=Math.cos(a)*2.2,oy=Math.sin(a)*2.2;b2+="M"+(x-dx).toFixed(2)+" "+(y-dy).toFixed(2)+"Q"+(x+ox).toFixed(2)+" "+(y+oy).toFixed(2)+" "+(x+dx).toFixed(2)+" "+(y+dy).toFixed(2);}
  p+='<path d="'+b2+'" stroke-width="1.6" stroke-linecap="round"/>';
  let c2="";for(let i=0;i<24;i++){const a=i*Math.PI/12;c2+='<circle cx="'+(50+38*Math.cos(a)).toFixed(2)+'" cy="'+(50+38*Math.sin(a)).toFixed(2)+'" r="1.4" fill="currentColor" stroke="none"/>';}
  return p+c2+"</svg>";
}

/* ================= phiên & gọi API ================= */
// Mã quản trị chỉ lưu trong sessionStorage (mất khi đóng tab); địa chỉ máy chủ (không bí mật) lưu localStorage — giữ như bản cũ.
let TOK=sessionStorage.getItem("ltd.admin.tok")||"";
let SRV=localStorage.getItem("ltd.admin.srv")||"";
const base=()=>SRV.trim().replace(/\/+$/,"");
async function api(method,path,body){
  let r;
  try{r=await fetch(base()+path,{method,headers:{"content-type":"application/json","x-admin-token":TOK},body:body===undefined?undefined:JSON.stringify(body)});}
  catch(e){throw new Error("Không kết nối được máy chủ");}
  let j={};try{j=await r.json();}catch(e){}
  if(r.status===401&&path.startsWith("/api/admin/")){logout("Mã quản trị không đúng hoặc đã đổi.");throw new Error("Sai mã quản trị");}
  if(!r.ok)throw new Error(j.message||j.error||("Lỗi "+r.status));
  return j;
}
function toast(t,ok=true){const e=h("div",{class:"toast "+(ok?"ok":"bad"),role:"status"},t);$("toasts").append(e);setTimeout(()=>e.remove(),3400);}
let onlTimer=0;
function setSrv(kind,text){$("srvdot").className="dot"+(kind==="ok"?"":" "+kind);$("srvt").textContent=text;}
async function refreshOnline(){
  const t=performance.now();
  try{const j=await api("GET","/api/admin/online");const ms=Math.round(performance.now()-t);
    $("onln").textContent=num(j.online);
    if(j.version)$("sver").textContent="Worker "+j.version;
    setSrv(ms<700?"ok":"warn",(ms<700?"Máy chủ ổn định":"Máy chủ chậm")+" · "+ms+" ms");}
  catch(e){if(TOK)setSrv("bad","Mất kết nối máy chủ");}
}
async function login(tok,srv){
  TOK=tok;SRV=srv||"";
  const j=await api("GET","/api/admin/online");
  sessionStorage.setItem("ltd.admin.tok",TOK);localStorage.setItem("ltd.admin.srv",SRV);
  $("onln").textContent=num(j.online);
  $("login").hidden=true;$("app").hidden=false;
  try{CARDS=(await api("GET","/api/admin/cards")).cards||{};}catch(e){}
  clearInterval(onlTimer);refreshOnline();onlTimer=setInterval(refreshOnline,30000);
  route();
}
function logout(msg){TOK="";sessionStorage.removeItem("ltd.admin.tok");clearInterval(onlTimer);$("app").hidden=true;$("login").hidden=false;$("lerr").textContent=msg||"";$("ltok").value="";$("ltok").focus();}
$("lform").onsubmit=async ev=>{ev.preventDefault();$("lerr").textContent="";try{await login($("ltok").value.trim(),$("lsrv").value.trim());}catch(e){$("lerr").textContent=e.message==="Sai mã quản trị"?"Mã quản trị không đúng.":e.message;}};
$("logout").onclick=()=>logout("Đã đăng xuất.");

const charts=new Set();
function chart(drawFn,hgt){const el=h("div",{class:"chart",style:"height:"+hgt+"px"});el._draw=()=>{el.textContent="";const w=el.clientWidth;if(w>0)el.append(drawFn(w,hgt,el));};charts.add(el);return el;}
function drawAll(){for(const c of charts){if(!c.isConnected){charts.delete(c);continue;}c._draw();}}
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(drawAll,120);});
function niceMax(v){if(v<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
const short=n=>n>=1e6?(Math.round(n/1e5)/10+"tr").replace(".",","):n>=1e3?(Math.round(n/100)/10+"k").replace(".",","):String(Math.round(n*10)/10).replace(".",",");
function tipShow(host,x,y,title,rows){let t=host.querySelector(".tip");if(!t){t=h("div",{class:"tip"});host.append(t);}t.textContent="";t.append(h("b",{},title),...rows.map(r=>h("div",{},r[0]?h("i",{style:"background:"+r[0]}):null,r[1])));const w=host.clientWidth;t.style.left=Math.max(70,Math.min(w-70,x))+"px";t.style.top=Math.max(34,y)+"px";t.hidden=false;}
function tipHide(host){const t=host.querySelector(".tip");if(t)t.hidden=true;}
// series: [{name,color,vals:[...]}] cùng độ dài với labels (ngày); kind 'bar' (chồng) | 'line'
function series(labels,ser,{kind="bar",fmt=num}={}){
  return (W,H,host)=>{
    const L=38,R=8,T=10,B=24,iw=W-L-R,ih=H-T-B,n=labels.length;
    const tot=labels.map((_,i)=>kind==="bar"?ser.reduce((a,x)=>a+(x.vals[i]||0),0):Math.max(...ser.map(x=>x.vals[i]||0)));
    const mx=niceMax(Math.max(1,...tot));
    const svg=s("svg",{width:W,height:H,viewBox:"0 0 "+W+" "+H,role:"img"});
    for(let g=0;g<=4;g++){const y=T+ih-ih*g/4;svg.append(s("line",{x1:L,x2:W-R,y1:y,y2:y,stroke:g?"#ffffff0f":"#ffffff26"}),s("text",{x:L-6,y:y+4,"text-anchor":"end"},short(mx*g/4)));}
    const step=iw/Math.max(1,n),every=Math.ceil(n/Math.max(2,Math.floor(iw/46)));
    labels.forEach((lb,i)=>{if(i%every===0)svg.append(s("text",{x:L+step*i+step/2,y:H-6,"text-anchor":"middle"},fDay(lb)));});
    const hits=[];
    const ypos=i=>{let y=T+ih;if(kind==="bar")y=T+ih-ih*tot[i]/mx;else for(const x of ser)y=Math.min(y,T+ih-ih*(x.vals[i]||0)/mx);return y;};

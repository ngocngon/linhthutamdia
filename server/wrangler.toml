name = "linhthu-server"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

# Không đặt bí mật ở đây. ADMIN_TOKEN và SESSION_SECRET đặt bằng `wrangler secret put` (xem README.md).
[vars]
# Thêm nguồn web được phép gọi API (cách nhau bằng dấu phẩy). http://localhost:* và http://127.0.0.1:* luôn được phép.
ALLOWED_ORIGINS = "https://tamdia.pages.dev,https://localhost,capacitor://localhost"
# OAuth Client ID loại Web của Google (giá trị CÔNG KHAI, không phải bí mật). Để trống = tắt đăng nhập Google. Xem README.md, mục "Bật đăng nhập Google".
GOOGLE_CLIENT_ID = ""
# Đăng ký mở mặc định bật; quản trị bật/tắt ở /admin (lưu trong D1, ưu tiên hơn biến này). Đặt "0" để mặc định tắt.
REGISTER_OPEN = "1"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Match"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker", "Match"]

[[d1_databases]]
binding = "DB"
database_name = "linhthu"
# Workflow deploy-server.yml tự thay database_id thật; giá trị dưới chỉ dùng khi chạy thử trên máy.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Sao lưu D1 hằng tuần (src/backup.js) vào KV riêng tư "linhthu-saoluu" (id không phải bí mật).
[[kv_namespaces]]
binding = "BACKUP"
id = "ffcac96032eb4b538e0ef77734c07c45"

# 03:17 giờ Việt Nam sáng thứ Hai (20:17 UTC Chủ nhật).
[triggers]
crons = ["17 20 * * SUN"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

name = "linhthu-server"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

# Không đặt bí mật ở đây. ADMIN_TOKEN và SESSION_SECRET đặt bằng `wrangler secret put` (xem README.md).
[vars]
# Thêm nguồn web được phép gọi API (cách nhau bằng dấu phẩy). http://localhost:* và http://127.0.0.1:* luôn được phép.
ALLOWED_ORIGINS = "https://ngocngon.github.io,https://localhost,capacitor://localhost"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Match"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker", "Match"]

[[d1_databases]]
binding = "DB"
database_name = "linhthu"
# Workflow deploy-server.yml tự thay database_id thật; giá trị dưới chỉ dùng khi chạy thử trên máy.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

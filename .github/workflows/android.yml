name: Dựng APK Android

# Chỉ dựng APK khi chủ game yêu cầu: tab Actions → "Dựng APK Android" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cài phụ thuộc
        run: npm install --no-audit --no-fund

      - name: Vá www cho vỏ Android
        run: python3 tools/android/patch_www.py

      - name: Tạo dự án Android
        run: |
          npx cap add android
          python3 tools/android/patch_android.py

      - name: Sinh biểu tượng
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Đồng bộ web vào Android
        run: npx cap sync android

      - name: Dựng APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Đổi tên APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LinhThuTamDia-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LinhThuTamDia-debug
          path: LinhThuTamDia-debug.apk

      - name: Đăng lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ban-thu-moi-nhat --cleanup-tag --yes || true
          gh release create ban-thu-moi-nhat LinhThuTamDia-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Bản thử mới nhất" \
            --notes "APK debug dựng tự động từ commit ${GITHUB_SHA::7} (lần chạy #${GITHUB_RUN_NUMBER}). Chỉ để cài thử."

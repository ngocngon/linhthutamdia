name: Triển khai link ngắn TamDia (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "link/**"
      - ".github/workflows/deploy-link.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Triển khai Worker tamdia
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: link
          command: deploy

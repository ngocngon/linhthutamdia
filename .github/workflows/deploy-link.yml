name: Triển khai link ngắn TamDia (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "link/**"
      - ".github/workflows/deploy-link.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Triển khai Worker tamdia
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: link
          command: deploy

  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tạo dự án Pages tamdia (nếu chưa có) và triển khai -> tamdia.pages.dev
        run: |
          npx --yes wrangler@4 pages project create tamdia --production-branch main || true
          npx --yes wrangler@4 pages deploy link/pages --project-name tamdia --branch main --commit-dirty=true
          npx --yes wrangler@4 pages project list

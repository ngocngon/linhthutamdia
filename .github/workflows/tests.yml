name: Kiểm thử

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/engine-sim.mjs
      - name: Luật kéo thẻ xuống chiến địa
        run: node tests/rules-pulled.mjs

  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài Playwright (chỉ trong tests/, không đụng package.json gốc)
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Smoke test giao diện
        working-directory: tests
        run: node ui-smoke.mjs
      - name: Tải ảnh chụp màn hình
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/artifacts/
          if-no-files-found: ignore
